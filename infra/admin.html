async function assetAction(a, t) {
  const id = t.getAttribute("data-id");
  const it = id ? ASSET_LIB.items.find(function (x) { return x.id === id; }) : null;
  if (a === "asset-fav" && it) {
    const d = await patchAsset({ id: id, favorite: !it.favorite });
    if (d) { it.favorite = d.item.favorite; ASSET_LIB.dirty = d.dirty; renderAssets(); }
  } else if (a === "asset-use") {
    const draft = ASSET_LIB.draft.slice();
    const i = draft.indexOf(id);
    if (i >= 0) draft.splice(i, 1); else draft.push(id);
    await saveDraft(draft);
  } else if (a === "asset-move") {
    const draft = ASSET_LIB.draft.slice();
    const i = draft.indexOf(id), j = i + Number(t.getAttribute("data-d"));
    if (i < 0 || j < 0 || j >= draft.length) return;
    const tmp = draft[i]; draft[i] = draft[j]; draft[j] = tmp;
    await saveDraft(draft);
  } else if (a === "asset-del") {
    const del = t.getAttribute("data-del") === "1";
    if (del && !(await confirmBox("Hide this image?", "<p>It disappears from this page and from the website rotator. The file itself stays safe in the repo, and you can restore it from Deleted.</p>", "Hide image", true))) return;
    const d = await patchAsset({ id: id, deleted: del });
    if (d) { delete ASSET_SELECTED[id]; await loadAssets(); }
  } else if (a === "asset-zoom" && it) {
    const h = it.hero || {};
    const src = h.jpg928 || h.jpg1080 || h.jpg1400 || h.jpg700 || h.jpg640 || (it.square && it.square.jpg) || it.preview || "";
    $("lightbox-slot").innerHTML = '<div class="lightbox" id="lightbox" data-action="lb-close"><figure><img src="' + esc(src) + '" alt="' + esc(it.label) + '"><figcaption>' + esc(it.label || id) + '</figcaption></figure><button type="button" class="ib" data-action="lb-close" aria-label="Close">' + ic("x") + "</button></div>";
    document.body.style.overflow = "hidden";
  } else if (a === "asset-clear") {
    ASSET_SELECTED = {}; renderAssets();
  } else if (a === "bulk-fav" || a === "bulk-del" || a === "bulk-restore") {
    const ids = selectedIds();
    if (!ids.length) { toast("Select some images first"); return; }
    if (a === "bulk-del" && !(await confirmBox("Hide " + plural(ids.length, "image") + "?", "<p>They disappear from this page and from the website rotator. The files stay in the repo, and you can restore them from Deleted.</p>", "Hide images", true))) return;
    const on = t.getAttribute("data-on") === "1";
    const d = await bulkPatch(a === "bulk-fav" ? { ids: ids, favorite: on } : { ids: ids, deleted: a === "bulk-del" });
    if (!d) return;
    if (a !== "bulk-fav") ASSET_SELECTED = {};
    toast(a === "bulk-fav" ? (on ? "Favourited " : "Unfavourited ") + d.changed : (a === "bulk-del" ? "Hid " : "Restored ") + plural(d.changed, "image"));
    await loadAssets();
  } else if (a === "add-cat") {
    const name = ($("im-newcat").value || "").trim();
    if (!name) { $("im-newcat").focus(); return; }
    const r = await api("/api/admin/assets/category", { method: "POST", body: { name: name } });
    if (!r.ok) { toast("Could not add the category"); return; }
    AF.cat = name;
    await loadAssets();
  } else if (a === "publish") {
    if (!(await confirmBox("Publish the rotator?", "<p>The homepage starts showing these " + plural(ASSET_LIB.draft.length, "photo") + " in this order.</p>", "Publish", false))) return;
    const r = await api("/api/admin/assets/publish", { method: "POST" });
    if (!r.ok) { toast(r.data.error || "Publish failed"); return; }
    ASSET_LIB.published = r.data.published;
    ASSET_LIB.publishedAt = r.data.publishedAt;
    ASSET_LIB.dirty = false;
    ASSET_LIB.live = r.data.live;
    renderAssets();
    toast("Published to the website");
  }
}
function closeLightbox() {
  if (!$("lightbox")) return false;
  $("lightbox-slot").innerHTML = "";
  document.body.style.overflow = "";
  return true;
}

/* ============================== routing ============================== */
function route() {
  const raw = location.hash.replace(/^#/, "");
  const h = raw.split(/[/?]/)[0];
  const q = new URLSearchParams(raw.split("?")[1] || "");
  if (q.get("zoho")) {
    // Back from the Zoho sign-in.
    history.replaceState(null, "", "#" + h);
    if (q.get("zoho") === "connected") { toast("Zoho Mail connected. The inbox is ready"); S.emailFilter = "inbox"; MAIL.inbox = null; MAIL.sent = null; loadEmails(true); }
    else toast("Zoho didn’t connect: " + (q.get("msg") || "try again"));
  }
  showView(HASH_TO_VIEW[h] || "orders");
}
function showView(v) {
  const changed = S.view !== v;
  // Leaving a view closes its overlay pane without touching history.
  ["o-detail", "e-detail"].forEach(function (id) { const p = $(id); if (p && changed && p.classList.contains("open")) { p.classList.remove("open"); $("scrim").classList.remove("on"); document.body.style.overflow = ""; } });
  S.view = v;
  qsa(".view").forEach(function (el) { el.hidden = el.getAttribute("data-view") !== v; });
  document.body.setAttribute("data-view", v);
  const title = document.querySelector('.view[data-view="' + v + '"] .vhead h1');
  $("navbar-title").textContent = title ? title.textContent : "";
  queueNavbar();
  if (v === "orders") seenOrders();
  setTitle();
  renderNav();
  updateSaveBar();
  if (changed) window.scrollTo(0, 0);
  if (v === "stock" && !$("stock-body").innerHTML) renderStock();
  if (v === "emails") { renderEmails(); loadEmails(); }
  if (v === "customers") renderCustomers();
  if (v === "run") { if (changed) S.runOpen = null; renderRun(); }
  syncWakeLock();
  if (v === "competitors" && changed) loadPriceWatch();
  if (v === "news" && changed) { NW_SEEN = nwSeenGet(); nwSeenSet(Date.now()); NW_LIMIT = 60; if (NW) renderNews(); loadNews(); }
  if (v === "growers" && changed) { GR_LIMIT = 80; if (GR) renderGrowers(); loadGrowers(); }
  if (v === "visits" && changed) loadVisits();
  if (v === "images" && changed) loadAssets();
}
function go(hash) { if (location.hash === "#" + hash) route(); else location.hash = hash; }

  "mail-reply": function (t) { replyTo(t.getAttribute("data-folder"), t.getAttribute("data-id")); },
  "mail-unread": function (t) { markUnread(t.getAttribute("data-id")); },
  "mail-pic": openMailPic,
  "mail-more": function (t) { loadMail(t.getAttribute("data-folder"), true); },

  "compose": function () { composeMail({}); },
  "compose-order": function (t) {
    const o = findOrder(t.getAttribute("data-id"));
    if (o) composeMail({ to: orderEmail(o), subject: "Your YOLKO order #" + orderRef(o), orderId: o.id });
  },
  "zoho-connect": zohoConnect,

  "test-email": testEmail,
  reminders: openReminders,
  "logout": function () { try { localStorage.removeItem("yolko_admin_key"); } catch (e) {} location.replace("/admin"); },
  theme: function (t) { setTheme(t.getAttribute("data-t") || ""); },

    const input = $(t.getAttribute("data-target"));

  "nw-filter": nwFilter,

  "gr-mail": function (t) { composeMail({ to: t.getAttribute("data-to"), subject: "", draftKey: "g:" + t.getAttribute("data-to") }); },

  "visits-refresh": function () { loadVisits(); },
  "assets-refresh": function () { loadAssets(); },
  "lb-close": function (t, e) { if (e.target.closest("figure") && !e.target.closest(".ib")) return; closeLightbox(); },

["asset-fav", "asset-use", "asset-move", "asset-del", "asset-zoom", "asset-clear", "bulk-fav", "bulk-del", "bulk-restore", "add-cat", "publish"].forEach(function (a) {
  ACTIONS[a] = function (t) { assetAction(a, t); };
});
document.addEventListener("click", function (e) {
  if (e.target.closest("[data-close-modal]")) closeModal(null);
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const fn = ACTIONS[t.getAttribute("data-action")];
  if (!fn) return;
  if (t.tagName === "A") e.preventDefault();
  fn(t, e);
});
// Tapping the clear button keeps the cursor in the search field, so a phone keyboard stays up.
document.addEventListener("mousedown", function (e) { if (e.target.closest && e.target.closest(".search .sx")) e.preventDefault(); });
document.addEventListener("input", function (e) {
  const t = e.target;
  if (t.id === "o-q") { S.q = t.value; renderOrdersMeta(); renderOrderList(); return; }
  // Toggles and radios are handled on "change"; typing fields update as you type.
  if (t.closest && t.closest("#v-stock") && t.matches('input:not([type="checkbox"]):not([type="radio"])')) { onStockInput(t); return; }
  if (t.id === "im-q") { AF.q = t.value; renderAssets(); }
  if (t.id === "gr-q") { GF.q = t.value; GR_LIMIT = 80; grRenderList(); }
});
document.addEventListener("change", function (e) {
  const t = e.target;
  if (/^st-n-/.test(t.id || "")) { if (t.value === "") { t.value = 0; onStockInput(t); } return; }
  if (t.id === "im-cat") { AF.cat = t.value; renderAssets(); return; }
  if (t.id === "gr-area") { GF.area = t.value; GR_LIMIT = 80; grRenderList(); return; }
  if (t.id === "gr-eggs") { GF.eggs = t.value; GR_LIMIT = 80; grRenderList(); return; }
  if (t.id === "im-view") { AF.view = t.value; renderAssets(); return; }
  if (t.id === "im-all") { ASSET_VISIBLE_IDS.forEach(function (id) { if (t.checked) ASSET_SELECTED[id] = true; else delete ASSET_SELECTED[id]; }); renderAssets(); return; }
  if (t.hasAttribute && t.hasAttribute("data-asset-pick")) {
    const id = t.getAttribute("data-asset-pick");
    if (t.checked) ASSET_SELECTED[id] = true; else delete ASSET_SELECTED[id];
    const card = t.closest(".acard"); if (card) card.classList.toggle("sel", t.checked);
    updateBulkBar(); return;
  }
  if (t.hasAttribute && t.hasAttribute("data-asset-cat")) {
    const id = t.getAttribute("data-asset-cat");
    patchAsset({ id: id, category: t.value }).then(function (d) {
      if (!d) return;
      const it = ASSET_LIB.items.find(function (x) { return x.id === id; });
      if (it) it.category = d.item.category;
      renderAssets();
    });
  }
});
document.addEventListener("keydown", function (e) {
  if ($("modal-wrap")) { if (e.key === "Escape") closeModal(null); return; }
  if (e.key === "Escape" && closeLightbox()) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s" && S.view === "stock") { e.preventDefault(); saveSettings(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing) {
    if (e.key === "Escape" && e.target.id === "o-q") {
      // Like a Mac search field: the first Escape clears the text, the next one leaves the field.
      if (e.target.value) { setQuery(""); return; }
      setSearching(false); e.target.blur(); return;
    }
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.view === "orders") {
    if (e.key === "/") { e.preventDefault(); setSearching(true); return; }
    if (e.key === "Escape" && S.selectedId) { closeDetail(); return; }
    if (e.key === "j" || e.key === "k") {
      if (!VISIBLE_IDS.length) return;
      const i = VISIBLE_IDS.indexOf(S.selectedId);
      const n = e.key === "j" ? Math.min(VISIBLE_IDS.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
      selectOrder(VISIBLE_IDS[n]);
      const row = document.querySelector('#o-list .row[data-id="' + CSS.escape(VISIBLE_IDS[n]) + '"]');
      if (row) row.scrollIntoView({ block: "nearest" });
    }
  } else if (S.view === "emails" && (e.key === "j" || e.key === "k")) {
    const ids = qsa("#e-list .row").map(function (r) { return r.getAttribute("data-id"); });
    if (!ids.length) return;
    const mailTab = S.emailFilter === "inbox" || S.emailFilter === "sent";
    const cur = mailTab ? S.mailSel[S.emailFilter] : S.emailSel;
    const i = ids.indexOf(cur);
    const n = e.key === "j" ? Math.min(ids.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
    if (mailTab) openMail(S.emailFilter, ids[n]); else openEmail(ids[n]);
  } else if (e.key === "Escape") closeDetail();
});
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", function (e) { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && KEY && Date.now() - S.lastLoad > 15000) loadOrders();
  if (!document.hidden && S.view === "orders") seenOrders();
  syncWakeLock();
});
window.addEventListener("focus", function () { if (S.view === "orders") seenOrders(); });
OVERLAY_MQ.addEventListener && OVERLAY_MQ.addEventListener("change", function () {
  // Crossing the breakpoint: drop any open drawer so the side panel takes over.
  ["o-detail", "e-detail"].forEach(function (id) { $(id).classList.remove("open"); });
  $("scrim").classList.remove("on");
  document.body.style.overflow = "";
  renderDetail();
  if (S.view === "emails") renderEmailDetail();
});

/* ============================== sign in + boot ============================== */
let POLL = null;
function showLogin(msg) {
  $("app").hidden = true;
  $("login").hidden = false;
  $("login-msg").textContent = msg || "";
  setTimeout(function () { $("key").focus(); }, 30);
}
function sessionExpired() {
  if (!KEY) return;
  KEY = "";
  try { localStorage.removeItem("yolko_admin_key"); } catch (e) {}
  if (POLL) clearInterval(POLL);
  POLL = null;
  showLogin("Session expired. Sign in again");
}
$("login-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const k = ($("key").value || "").trim();
  if (!k) { $("login-msg").textContent = "Paste your admin key first"; return; }
  const btn = $("signin-btn");
  btn.classList.add("busy");
  $("login-msg").textContent = "";
  let res;
  try { res = await fetch("/api/admin/ping", { headers: { Authorization: "Bearer " + k } }); }
  catch (err) { btn.classList.remove("busy"); $("login-msg").textContent = "Network error. Try again"; return; }
  btn.classList.remove("busy");
  if (res.ok) {
    KEY = k;
    try { localStorage.setItem("yolko_admin_key", k); } catch (err) {}
    $("key").value = "";
    boot();
  } else {
    $("login-msg").textContent = res.status === 401 ? "That key didn’t work. Try again" : "Sign-in failed (" + res.status + ")";
  }
});
function boot() {
  $("login").hidden = true;
  $("app").hidden = false;
  hydrateIcons(document);
  $("appear").innerHTML = appearHtml();
  renderNav();
  renderWeek();
  renderOrdersMeta();
  renderOrderList();
  renderDetail();
  renderStock();
  route();
  loadSettings();
  loadOrders().then(function () {
    // Wide screens open the first order so the detail panel is never blank.
    if (!S.selectedId && !OVERLAY_MQ.matches && S.view === "orders" && VISIBLE_IDS.length) selectOrder(VISIBLE_IDS[0]);
  });
  renderBell();
  pollHead();
  loadEmails();
  if (POLL) clearInterval(POLL);
  let ticks = 0;
  POLL = setInterval(function () {
    ticks++;
    pollHead();
    if (!document.hidden) loadOrders(); else renderOrdersSub();
    if (ticks % 4 === 0) pollUnread();
  }, 30000);
}
if (KEY) boot(); else showLogin("");
