async function assetAction(a, t) {
  const id = t.getAttribute("data-id");
  const it = id ? ASSET_LIB.items.find(function (x) { return x.id === id; }) : null;
  if (a === "asset-fav" && it) {
    const d = await patchAsset({ id: id, favorite: !it.favorite });
    if (d) { it.favorite = d.item.favorite; ASSET_LIB.dirty = d.dirty; renderAssets(); }
  } else if (a === "asset-use") {
    const draft = ASSET_LIB.draft.slice();
    const i = draft.indexOf(id);
    if (i >= 0) draft.splice(i, 1); else draft.push(id);
    await saveDraft(draft);
  } else if (a === "asset-move") {
    const draft = ASSET_LIB.draft.slice();
    const i = draft.indexOf(id), j = i + Number(t.getAttribute("data-d"));
    if (i < 0 || j < 0 || j >= draft.length) return;
    const tmp = draft[i]; draft[i] = draft[j]; draft[j] = tmp;
    await saveDraft(draft);
  } else if (a === "asset-del") {
    const del = t.getAttribute("data-del") === "1";
    if (del && !(await confirmBox("Hide this image?", "<p>It disappears from this page and from the website rotator. The file itself stays safe in the repo, and you can restore it from Deleted.</p>", "Hide image", true))) return;
    const d = await patchAsset({ id: id, deleted: del });
    if (d) { delete ASSET_SELECTED[id]; await loadAssets(); }
  } else if (a === "asset-zoom" && it) {
    const h = it.hero || {};
    const src = h.jpg928 || h.jpg1080 || h.jpg1400 || h.jpg700 || h.jpg640 || (it.square && it.square.jpg) || it.preview || "";
    $("lightbox-slot").innerHTML = '<div class="lightbox" id="lightbox" data-action="lb-close"><figure><img src="' + esc(src) + '" alt="' + esc(it.label) + '"><figcaption>' + esc(it.label || id) + '</figcaption></figure><button type="button" class="ib" data-action="lb-close" aria-label="Close">' + ic("x") + "</button></div>";
    document.body.style.overflow = "hidden";
  } else if (a === "asset-clear") {
    ASSET_SELECTED = {}; renderAssets();
  } else if (a === "bulk-fav" || a === "bulk-del" || a === "bulk-restore") {
    const ids = selectedIds();
    if (!ids.length) { toast("Select some images first"); return; }
    if (a === "bulk-del" && !(await confirmBox("Hide " + plural(ids.length, "image") + "?", "<p>They disappear from this page and from the website rotator. The files stay in the repo, and you can restore them from Deleted.</p>", "Hide images", true))) return;
    const on = t.getAttribute("data-on") === "1";
    const d = await bulkPatch(a === "bulk-fav" ? { ids: ids, favorite: on } : { ids: ids, deleted: a === "bulk-del" });
    if (!d) return;
    if (a !== "bulk-fav") ASSET_SELECTED = {};
    toast(a === "bulk-fav" ? (on ? "Favourited " : "Unfavourited ") + d.changed : (a === "bulk-del" ? "Hid " : "Restored ") + plural(d.changed, "image"));
    await loadAssets();
  } else if (a === "add-cat") {
    const name = ($("im-newcat").value || "").trim();
    if (!name) { $("im-newcat").focus(); return; }
    const r = await api("/api/admin/assets/category", { method: "POST", body: { name: name } });
    if (!r.ok) { toast("Could not add the category"); return; }
    AF.cat = name;
    await loadAssets();
  } else if (a === "publish") {
    if (!(await confirmBox("Publish the rotator?", "<p>The homepage starts showing these " + plural(ASSET_LIB.draft.length, "photo") + " in this order.</p>", "Publish", false))) return;
    const r = await api("/api/admin/assets/publish", { method: "POST" });
    if (!r.ok) { toast(r.data.error || "Publish failed"); return; }
    ASSET_LIB.published = r.data.published;
    ASSET_LIB.publishedAt = r.data.publishedAt;
    ASSET_LIB.dirty = false;
    ASSET_LIB.live = r.data.live;
    renderAssets();
    toast("Published to the website");
  }
}

function route() {

    history.replaceState(null, "", "#" + h);

  if (e.key === "Escape" && closeLightbox()) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s" && S.view === "stock") { e.preventDefault(); saveSettings(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing) {
    if (e.key === "Escape") { e.target.blur(); if (e.target.id === "o-q") $("v-orders").classList.remove("searching"); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.view === "orders") {
    if (e.key === "/") { e.preventDefault(); $("v-orders").classList.add("searching"); $("o-q").focus(); return; }
    if (e.key === "Escape" && S.selectedId) { closeDetail(); return; }
    if (e.key === "j" || e.key === "k") {
      if (!VISIBLE_IDS.length) return;
      const i = VISIBLE_IDS.indexOf(S.selectedId);
      const n = e.key === "j" ? Math.min(VISIBLE_IDS.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
      selectOrder(VISIBLE_IDS[n]);
      const row = document.querySelector('#o-list .row[data-id="' + CSS.escape(VISIBLE_IDS[n]) + '"]');
      if (row) row.scrollIntoView({ block: "nearest" });
    }

    const ids = qsa("#e-list .row").map(function (r) { return r.getAttribute("data-id"); });
    if (!ids.length) return;
    const mailTab = S.emailFilter === "inbox" || S.emailFilter === "sent";
    const cur = mailTab ? S.mailSel[S.emailFilter] : S.emailSel;
    const i = ids.indexOf(cur);
    const n = e.key === "j" ? Math.min(ids.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);

    if (ticks % 4 === 0) pollUnread();
  }, 30000);
}
if (KEY) boot(); else showLogin("");
</script>
