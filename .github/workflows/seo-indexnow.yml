name: SEO IndexNow ping

# Runs after each Worker deploy (that is when new pages actually go live),
# and pings every URL in sitemap.xml so Bing and other IndexNow engines recrawl.
on:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
  workflow_dispatch:

jobs:
  indexnow:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ping IndexNow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node infra/seo-indexnow.mjs
